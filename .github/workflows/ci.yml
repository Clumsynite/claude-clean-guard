name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh scripts/*.sh tests/run.sh
      - name: JSON manifests
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json > /dev/null
      - name: Manifests agree
        run: |
          name=$(jq -r .name .claude-plugin/plugin.json)
          jq -e --arg n "$name" '.plugins | map(.name) | index($n) != null' .claude-plugin/marketplace.json > /dev/null \
            || { echo "::error::marketplace.json has no plugin named $name"; exit 1; }
      - name: README release badge matches plugin.json
        # The repo is private, so shields.io can't read releases; the badge is static instead.
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          grep -q "img.shields.io/badge/release-v$version-blue" README.md \
            || { echo "::error::README release badge doesn't say v$version; update it with the version bump"; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Current git (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq git mawk gawk
      - name: Current git (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git mawk gawk
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: git supports config-based hooks
        run: |
          git --version
          git init -q "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          git config hook.probe.event pre-push
          git config hook.probe.command true
          git hook list pre-push | grep -qx probe \
            || { echo "::error::this git has no config-based hooks (needs 2.54+)"; exit 1; }
      - name: Script tests
        run: sh tests/run.sh
      - name: Script tests under dash
        if: runner.os == 'macOS'
        run: TEST_SH=dash sh tests/run.sh
